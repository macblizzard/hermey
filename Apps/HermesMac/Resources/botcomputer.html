<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shared computer</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  /* Fixed and gesture-free: a drag on the desktop must reach the remote pointer, not scroll, zoom or
     rubber-band this page (on iOS that same gesture is what was closing the window around the picture). */
  #screen { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none;
            transform-origin: 0 0; }
  #screen canvas { outline: none; touch-action: none; }
  * { -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

  /* The keyboard. iOS raises keys only for an editable element focused by a tap *inside the page*;
     a focus() call from native code is not a user gesture, which is why the app's button did
     nothing. So there is a real (invisible) text area, and a visible button that taps it. */
  #keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0.01;
          border: 0; padding: 0; margin: 0; font-size: 16px; background: transparent;
          -webkit-user-select: text; user-select: text; }
  #keyboardButton { position: fixed; right: 14px; bottom: 16px; width: 46px; height: 46px;
                    border-radius: 23px; border: 1px solid rgba(255,255,255,0.22);
                    background: rgba(20,20,22,0.78); color: #fff; font-size: 21px; line-height: 1;
                    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  #keyboardButton[hidden] { display: none; }
  #keyboardButton:active { background: rgba(70,70,76,0.95); }
  #toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
           padding: 7px 13px; border-radius: 14px; background: rgba(18,18,20,0.82);
           color: rgba(255,255,255,0.9); font: 12.5px -apple-system, system-ui, sans-serif;
           white-space: nowrap; opacity: 0; transition: opacity 0.35s; pointer-events: none; }
  #zoomBadge { position: fixed; right: 14px; bottom: 70px; padding: 3px 8px; border-radius: 10px;
               background: rgba(0,0,0,0.6); color: rgba(255,255,255,0.8);
               font: 11px -apple-system, system-ui, sans-serif; opacity: 0; transition: opacity 0.3s;
               pointer-events: none; }
</style>
</head>
<body>
<div id="screen"></div>
<textarea id="keys" autocorrect="off" autocapitalize="off" autocomplete="off"
          spellcheck="false" aria-label="Type on the shared computer"></textarea>
<button id="keyboardButton" hidden aria-label="Show the keyboard">⌨</button>
<div id="zoomBadge"></div>
<div id="toast"></div>
<script>
  // Defined before noVNC's module runs, because the native side sets this flag on its first layout
  // pass — long before the module has finished loading. The value is kept and replayed on connect,
  // which is what makes "Take over" enable pointer and keyboard at all.
  window.__hermeyViewOnly = true;
  window.hermeySetViewOnly = function (only) {
    window.__hermeyViewOnly = !!only;
    if (window.__hermeyApply) { window.__hermeyApply(); }
  };
  // Convenience path for the app's own keyboard button; the in-page button is the reliable one.
  window.hermeyFocusKeyboard = function () { if (window.__hermeyFocus) { window.__hermeyFocus(); } };
</script>
<script type="module">
  // The bundled noVNC, served by the app's own URL scheme handler so its ES-module imports resolve.
  // Nothing here talks to the open internet: the socket is the paired host on the tailnet.
  import RFB from './novnc/core/rfb.js';
  import { getKeycode, getKeysym } from './novnc/core/input/util.js';
  import { releaseCapture } from './novnc/core/util/events.js';

  const params = new URLSearchParams(window.location.search);
  const target = params.get('ws');
  if (params.get('viewOnly') === '0') { window.__hermeyViewOnly = false; }
  const screen = document.getElementById('screen');
  const keys = document.getElementById('keys');
  const keyboardButton = document.getElementById('keyboardButton');
  // Touch devices only: on a Mac the physical keyboard is already there and a floating ⌨ is noise.
  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  const zoomBadge = document.getElementById('zoomBadge');
  const toastBox = document.getElementById('toast');

  let toastTimer;
  function toast(text, milliseconds = 3200) {
    toastBox.textContent = text;
    toastBox.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastBox.style.opacity = '0'; }, milliseconds);
  }

  function post(event, extra) {
    try {
      window.webkit.messageHandlers.bridge.postMessage(Object.assign({ event }, extra || {}));
    } catch (e) { /* a preview/WKWebView without the handler */ }
  }

  if (!target) {
    post('error', { message: 'no socket' });
  } else {
    const rfb = new RFB(screen, target, { shared: true, wsProtocols: [] });
    rfb.background = '#000';
    rfb.scaleViewport = true;      // fit the phone/Mac panel instead of scrolling a 1440x900 desktop
    rfb.resizeSession = false;     // never make the bot's desktop smaller because of this viewer
    rfb.showDotCursor = true;      // a dot is how you see where you tapped
    rfb.focusOnClick = false;      // the keyboard belongs to the text area, not the canvas
    rfb.viewOnly = window.__hermeyViewOnly;   // UI hint only — the host's lease is the actual gate

    // ---- keyboard --------------------------------------------------------------------------
    // The text area is the event source, so keys are sent with noVNC's own keysym mapping rather
    // than by re-dispatching synthetic events (whose keyCode the constructor cannot set).
    function sendKeystroke(event) {
      const keysym = getKeysym(event);
      if (!keysym) { return false; }
      const code = getKeycode(event);
      // Press and release together: a soft keyboard often never sends keyup, and a key left down
      // keeps typing into the remote desktop forever.
      rfb.sendKey(keysym, code, true);
      rfb.sendKey(keysym, code, false);
      return true;
    }

    let lastKeydownAt = 0;
    keys.addEventListener('keydown', (event) => {
      if (window.__hermeyViewOnly) { return; }
      if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].includes(event.key)) { return; }
      lastKeydownAt = Date.now();
      if (sendKeystroke(event)) { event.preventDefault(); }
    });

    // Dictation, autocomplete and paste arrive as text with no usable keydown.
    keys.addEventListener('input', () => {
      const text = keys.value;
      keys.value = '';
      if (window.__hermeyViewOnly || Date.now() - lastKeydownAt < 80) { return; }
      for (const character of text) {
        const keysym = getKeysym({ key: character, code: '', keyCode: 0, shiftKey: false });
        if (keysym) { rfb.sendKey(keysym, '', true); rfb.sendKey(keysym, '', false); }
      }
    });

    window.__hermeyFocus = function () {
      if (window.__hermeyViewOnly) { return; }
      keys.focus({ preventScroll: true });
    };
    // A tap inside the page IS a user gesture, which is the only thing iOS accepts before it will
    // show a keyboard.
    keyboardButton.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      window.__hermeyFocus();
    });

    // ---- touch input -----------------------------------------------------------------------
    // noVNC's own recogniser is switched off. It reads a two-finger pinch as "scroll the viewport"
    // and a two-finger drag as wheel events — the opposite of what a phone wants here — and teaching
    // it only *some* of the events it expects left its state machine stuck: it had seen the first
    // finger go down and never the second, so taps stopped registering until an unrelated tap reset
    // it. This page now emits the same mouse events that recogniser would have produced, and owns
    // the two-finger gestures outright.
    if (rfb._gestures) { rfb._gestures.detach(); }

    const MAX_SCALE = 4;
    let scale = 1, tx = 0, ty = 0, badgeTimer = 0;
    let single = null;     // the one finger that is down
    let pinch = null;      // the two fingers

    const canvasOf = () => screen.querySelector('canvas');

    function mouse(type, point, buttons) {
      const element = canvasOf();
      if (!element || window.__hermeyViewOnly) { return; }
      element.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, view: window,
                                                   clientX: point.x, clientY: point.y,
                                                   button: 0, buttons }));
    }

    // noVNC's setCapture() is its old IE fallback: a press makes it lay a full-screen proxy div at
    // zIndex 10000 over everything, and only that div's own mouseup removes it. A press dispatched
    // straight at the canvas leaves that div behind, swallowing every later touch — which is what
    // "pinching stops working until I tap once" was. Release it ourselves, every time.
    function releaseCaptureIfAny() { try { releaseCapture(); } catch (e) {} }

    function click(point) {
      mouse('mousemove', point, 0);
      mouse('mousedown', point, 1);
      mouse('mouseup', point, 0);
      releaseCaptureIfAny();
    }

    // noVNC derives the button from `MouseEvent.buttons`, not `button`, and maps bit 1 to the
    // protocol's right button — so this is indistinguishable from a real right press.
    function rightClick(point) {
      mouse('mousemove', point, 0);
      mouse('mousedown', point, 2);
      mouse('mouseup', point, 0);
      releaseCaptureIfAny();
    }

    const spanOf = (touches) =>
      Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
    const middleOf = (touches) => ({ x: (touches[0].clientX + touches[1].clientX) / 2,
                                     y: (touches[0].clientY + touches[1].clientY) / 2 });

    function applyTransform() {
      screen.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      if (scale > 1.01) {
        zoomBadge.textContent = `${Math.round(scale * 100)}% · two fingers to move`;
        zoomBadge.style.opacity = '1';
        clearTimeout(badgeTimer);
        badgeTimer = setTimeout(() => { zoomBadge.style.opacity = '0'; }, 1600);
      } else {
        zoomBadge.style.opacity = '0';
      }
    }
    function clampPan() {
      const width = screen.clientWidth * scale;
      const height = screen.clientHeight * scale;
      tx = Math.min(0, Math.max(screen.clientWidth - width, tx));
      ty = Math.min(0, Math.max(screen.clientHeight - height, ty));
    }

    screen.addEventListener('touchstart', (event) => {
      if (event.touches.length === 1) {
        const touch = event.touches[0];
        single = { startX: touch.clientX, startY: touch.clientY,
                   x: touch.clientX, y: touch.clientY, pressed: false, moved: false };
      } else if (event.touches.length === 2) {
        // A second finger makes this the view's gesture: let go of any drag in progress first.
        if (single && single.pressed) {
          mouse('mouseup', { x: single.x, y: single.y }, 0);
          releaseCaptureIfAny();
        }
        single = null;
        pinch = { span: Math.max(1, spanOf(event.touches)), scale, tx, ty,
                  mid: middleOf(event.touches), startedAt: Date.now(), moved: 0 };
      }
    }, { passive: false });

    screen.addEventListener('touchmove', (event) => {
      if (event.touches.length === 1 && single) {
        const touch = event.touches[0];
        single.x = touch.clientX;
        single.y = touch.clientY;
        if (Math.hypot(single.x - single.startX, single.y - single.startY) > 6) { single.moved = true; }
        if (single.moved) {
          event.preventDefault();
          if (!single.pressed) {
            // Press where the finger started, so a drag grabs what it touched, not what it reached.
            single.pressed = true;
            mouse('mousemove', { x: single.startX, y: single.startY }, 0);
            mouse('mousedown', { x: single.startX, y: single.startY }, 1);
          }
          mouse('mousemove', { x: single.x, y: single.y }, 1);
        }
        return;
      }
      if (event.touches.length !== 2 || !pinch) { return; }
      event.preventDefault();
      const now = middleOf(event.touches);
      // How far this gesture has travelled, so a two-finger *tap* can be told from a pinch or pan.
      pinch.moved = Math.max(pinch.moved,
                             Math.abs(now.x - pinch.mid.x) + Math.abs(now.y - pinch.mid.y),
                             Math.abs(spanOf(event.touches) - pinch.span));
      const next = Math.min(MAX_SCALE, Math.max(1, pinch.scale * spanOf(event.touches) / pinch.span));
      const ratio = next / pinch.scale;
      // Keep the point between the fingers under the fingers (this also pans, since the midpoint
      // moves when both fingers are dragged together).
      tx = now.x - (pinch.mid.x - pinch.tx) * ratio;
      ty = now.y - (pinch.mid.y - pinch.ty) * ratio;
      scale = next;
      clampPan();
      applyTransform();
    }, { passive: false });

    function endTouches(event) {
      if (event.touches.length !== 0) { return; }
      if (single) {
        if (single.pressed) {
          mouse('mouseup', { x: single.x, y: single.y }, 0);
          releaseCaptureIfAny();
        } else if (!single.moved) {
          click({ x: single.x, y: single.y });
        }
        single = null;
        return;
      }
      if (!pinch) { return; }
      // A two-finger tap that neither moved nor resized is the right click: the desktop equivalent
      // of pressing the right button, which a phone has no other way to do.
      const wasTap = pinch.moved < 14 && Date.now() - pinch.startedAt < 400;
      if (scale <= 1.02) { scale = 1; tx = 0; ty = 0; applyTransform(); }
      const middle = pinch.mid;
      pinch = null;
      if (wasTap) { rightClick(middle); }
    }
    screen.addEventListener('touchend', endTouches, { passive: false });
    screen.addEventListener('touchcancel', endTouches, { passive: false });

    window.__hermeyResetZoom = function () { scale = 1; tx = 0; ty = 0; applyTransform(); };
    window.hermeyResetZoom = window.__hermeyResetZoom;

    // ---- connection -------------------------------------------------------------------------
    // Enabling input turns off noVNC's view-only mode and offers the keyboard. Nothing here grabs
    // keys: they arrive through the text area above, so no gesture is taken from the desktop.
    let toldOnce = false;
    window.__hermeyApply = function () {
      rfb.viewOnly = window.__hermeyViewOnly;
      keyboardButton.hidden = window.__hermeyViewOnly || !isTouch;
      if (window.__hermeyViewOnly) { keys.blur(); return; }
      if (!toldOnce && isTouch) {
        toldOnce = true;
        toast('Pinch to zoom · two-finger tap to right-click');
      }
    };

    rfb.addEventListener('connect', () => {
      // connect() attaches the recogniser again; it is detached for as long as this page drives
      // touches itself.
      if (rfb._gestures) { rfb._gestures.detach(); }
      post('connected');
      window.__hermeyApply();
    });
    rfb.addEventListener('disconnect', (e) => post('disconnected', { clean: !!(e.detail && e.detail.clean) }));
    rfb.addEventListener('securityfailure', () => post('error', { message: 'security failure' }));

    window.hermeyDisconnect = () => { try { rfb.disconnect(); } catch (e) {} };
  }
</script>
</body>
</html>
