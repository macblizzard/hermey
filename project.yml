name: HermesApps
options:
  bundleIdPrefix: dev.hermey.app
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  groupSortPosition: top

packages:
  HermesApps:
    path: .
  # In-app updates. Sparkle downloads the DMG named by the Pages appcast, verifies its EdDSA
  # signature and swaps the bundle — the app only has to own a controller and offer the verb.
  # Pinned to a minor floor rather than a branch: the feed's shape is Sparkle 2's, and 2.6 is the
  # first release that understands every key the publish already writes.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  HermesMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/HermesMac
        excludes:
          - "Resources/novnc/**"
      # A folder reference, not a group: noVNC's ES modules import each other by relative path, so
      # the tree must land in the bundle with its shape intact.
      - path: Apps/HermesMac/Resources/novnc
        type: folder
    dependencies:
      - package: HermesApps
        product: HermesKit
      - package: HermesApps
        product: HermeyUI
      - package: HermesApps
        product: HermesRender
      - package: HermesApps
        product: HermesAppKit
      # macOS only: iOS cannot replace its own bundle, so the phone's notifier opens a URL instead
      # (HermesAppKit/Updates). Nothing here reaches the HermesMobile target.
      - package: Sparkle
        product: Sparkle
    info:
      path: Apps/HermesMac/Info.plist
      properties:
        CFBundleDisplayName: Hermey
        # The menu bar reads CFBundleName, not the display name: without it the app menu says
        # "HermesMac" while the Dock says "Hermey".
        CFBundleName: Hermey
        # Variables, not literals: CI passes CURRENT_PROJECT_VERSION=<run number> so every
        # build is strictly newer than the last one, which is what makes a sideload source
        # show an *update* instead of re-installing the same version forever.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Sparkle 2 reads all five keys from the bundle at launch — the app itself carries no feed
        # URL and no version constant. The feed is the Pages appcast the publish writes; its
        # `sparkle:edSignature` is verified against the public key below, which is the only half of
        # the keypair that belongs in this repo. Rotating it breaks update trust for every older
        # build, so it is a breaking change rather than a tweak.
        SUFeedURL: https://macblizzard.github.io/hermey-downloads/appcast.xml
        SUPublicEDKey: ezxgxj3MqbAIuclhB15SoXkIuZzYTkUtKlSB9SeCEGk=
        # Check on Sparkle's own schedule (once a day) and *ask* — never install behind the user's
        # back, and never gate the app on it. A probe of a dead feed is silent, by Sparkle's design.
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 86400
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        # The AppIcon.appiconset is compiled into Assets.car by actool; this key is
        # what Finder/Dock look up on macOS 11+. Harmless if the build also injects it.
        CFBundleIconName: AppIcon
        NSHumanReadableCopyright: "Personal build"
        # Pressing record captures the Mac's default input device. macOS terminates an app that
        # opens a capture input without this string, so the prompt is the whole feature.
        NSMicrophoneUsageDescription: "Record a voice message to transcribe with your Hermes host."
        # A banner arrives from the relay app (Bark), which can only open a URL. `hermey://bot/<id>`
        # is how tapping it lands on the bot that spoke instead of on the list.
        CFBundleURLTypes:
          - CFBundleURLName: dev.hermey.app.mobile
            CFBundleURLSchemes:
              - hermey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hermey.app.mac
        # The bundle *file name* is what Finder, the Dock and Force Quit show; CFBundleName only
        # names the menu bar. Leaving this as "Hermes" kept the app called Hermes everywhere the
        # user actually looks.
        PRODUCT_NAME: Hermey
        ENABLE_HARDENED_RUNTIME: "NO"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HermesMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/HermesMacUITests
    dependencies:
      - target: HermesMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hermey.app.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HermesMac

  HermesMobile:
    type: application
    platform: iOS
    sources:
      - path: Apps/HermesMobile
        excludes:
          - "Resources/novnc/**"
      # Same reason as the Mac: a folder reference keeps noVNC's relative module imports working.
      - path: Apps/HermesMobile/Resources/novnc
        type: folder
    dependencies:
      - package: HermesApps
        product: HermesKit
      - package: HermesApps
        product: HermeyUI
      - package: HermesApps
        product: HermesRender
      - package: HermesApps
        product: HermesAppKit
    info:
      path: Apps/HermesMobile/Info.plist
      properties:
        CFBundleDisplayName: Hermey
        CFBundleName: Hermey
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The static launch screen iOS paints before any of our code runs. It cannot animate and it
        # cannot read `ThemeRuntime` — it is a compiled storyboard-less colour — so it is pinned to
        # the *default* theme's canvas (`ThemeCatalog.midnight`, 0x0A0A0A). That is the whole job of
        # this key: without it the system paints its own background (white on a light device) for the
        # frames between the tap and the first SwiftUI draw, which is the flash `BootScreen` exists to
        # prevent. A person on another theme sees a few dark frames before the splash, never white.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Hermes connects to your own Hermes host over your private network."
        # Required the moment the QR scanner asks for the camera: iOS terminates the app
        # on first capture input without this string, so pairing would look like a crash.
        NSCameraUsageDescription: "Scan the pairing code shown by your Hermes host to connect this device, and take photos to attach to a message."
        NSPhotoLibraryUsageDescription: "Choose a photo to attach to a message."
        NSMicrophoneUsageDescription: "Record a voice message to transcribe with your Hermes host."
        # A banner arrives from the relay app (Bark), which can only open a URL. `hermey://bot/<id>`
        # is how tapping it lands on the bot that spoke instead of on the list.
        CFBundleURLTypes:
          - CFBundleURLName: dev.hermey.app.mobile
            CFBundleURLSchemes:
              - hermey
        # `canOpenURL("altstore://install?url=…")` answers false for a scheme the app has not
        # declared — that is iOS's rule for "is this app installed" — which would hide the AltStore
        # button on every phone, including the ones that have it. Only the query needs the entry;
        # nothing is opened unless the query already answered true.
        # Each sideloading app the update card can offer. iOS answers `canOpenURL` with "no" for a
        # scheme that is not listed here — silently — so this list and `SideloadingApp.all` in
        # UpdatePrompt.swift must name the same schemes.
        LSApplicationQueriesSchemes:
          - altstore
          - sidestore
          - feather
        # A phone tears the socket down the moment the app leaves the foreground, so the only way a
        # suspended app can learn that a bot replied is one of iOS's own background refreshes —
        # which needs the fetch mode plus the exact identifier the app registers. iOS refuses a
        # request for an unlisted identifier, and it does so silently, so the two must not drift.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.hermey.app.mobile.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hermey.app.mobile
        PRODUCT_NAME: Hermey
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  HermesMac:
    build:
      targets:
        HermesMac: all
        HermesMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HermesMacUITests
  HermesMobile:
    build:
      targets:
        HermesMobile: all
    run:
      config: Debug
