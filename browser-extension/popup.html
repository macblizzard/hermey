<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hermey Sign-in</title>
    <style>
      body { font: 13px system-ui, sans-serif; margin: 14px; width: 250px; color: #141413; }
      h1 { font-size: 13px; margin: 0 0 8px; }
      p { margin: 0; color: #55524b; line-height: 1.4; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
      .on { background: #2e7d32; }
      .off { background: #b3261e; }
    </style>
  </head>
  <body>
    <h1>Hermey Sign-in</h1>
    <p><span id="dot" class="dot off"></span><span id="state">Connecting…</span></p>
    <p style="margin-top: 8px">
      When a bot reaches a login page, Hermey asks you for the details here — the password goes
      straight into the form and never into the chat.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
