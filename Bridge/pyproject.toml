[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-bridge"
version = "0.1.0"
description = "Loopback bridge between the Hermes native clients and the local TUI gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "websockets==17.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
hermes-bridge = "hermes_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["hermes_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
