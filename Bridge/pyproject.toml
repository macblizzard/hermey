[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-bridge"
version = "0.1.0"
description = "Loopback bridge between the Hermes native clients and the local TUI gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "websockets==17.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
hermes-bridge = "hermes_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["hermes_bridge*"]

# The Mac skill and its CLI are files, not modules, so they must be named here or a wheel ships
# without them and every install silently gets no instructions. `agent_skills/` has no
# `__init__.py` on purpose: it is data the bridge copies, never imports.
[tool.setuptools.package-data]
hermes_bridge = ["agent_skills/*/*.md", "agent_skills/bin/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
