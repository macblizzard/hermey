name: ci

# Read-only by default: this workflow builds installable artifacts, so its token should not be
# able to write anything it does not need to.
permissions:
  contents: read

# What this file optimises: the time between "the change is written" and "the maintainer can install it".
#
# Measured 2026-11-08 on the previous shape, for a 3-line UI change: packages 67 s, then apps 301 s
# (macOS Release build 186 s + iOS simulator Debug 92 s) = 368 s wall per run — and every change ran
# the whole thing twice, on the PR and again on `main`, because only a `main` run's artifacts were
# published. About 12 minutes of CI per change, most of it recompiling what Xcode had already
# compiled, and half of it on an identical tree.
#
# Four rules now:
#   * jobs that need no other job's result start together (only qa waits on bridge);
#   * **one** macOS job builds every artifact. The .ipa used to be its own job, which generated the
#     project and compiled HermesMobile a second time on a second macOS runner — and macOS runners
#     are the scarce resource: a starved pool cancels them, and a cancellation costs a re-run worth
#     more wall clock than the build ever did;
#   * a pull request whose diff touches no Swift skips the macOS jobs entirely. `main` always builds
#     everything, because publishing reads that run's artifacts;
#   * the SwiftPM *cache* is cached — tens of megabytes. DerivedData and `.build` are not: they are
#     hundreds of megabytes, and the free plan's 500 MB of storage is shared with artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What changed, for the two macOS jobs. Deliberately dependency-free: a `git diff` against the
  # pull request's base, no marketplace action, and it defaults to *true* on anything it cannot
  # read — a guard that silently skips the compiler is worse than a wasted runner.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.filter.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            echo "mac=true" >> "$GITHUB_OUTPUT"   # push to main, or a dispatch
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -Eq '^(Sources/|Apps/|Tools/|Package\.swift|Package\.resolved|project\.yml|Tests/.*\.swift|\.github/workflows/ci\.yml)'; then
            echo "mac=true" >> "$GITHUB_OUTPUT"
          else
            echo "mac=false" >> "$GITHUB_OUTPUT"
          fi

  packages:
    name: Swift packages (build + test)
    runs-on: macos-26
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      # The SwiftPM cache, and nothing else: it is the one directory here measured in tens of
      # megabytes. `.build` and DerivedData are hundreds, and the free plan's 500 MB of storage is
      # shared with artifacts — so those are rebuilt, and the account stays alive.
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --parallel

  apps:
    name: Apps (macOS + iOS, unsigned artifacts)
    runs-on: macos-26
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build macOS app
        run: |
          set -o pipefail
          xcodebuild -project HermesApps.xcodeproj -scheme HermesMac -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=0.1.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} build
      - name: Package the macOS app as a disk image
        run: |
          set -euo pipefail
          mkdir -p dist
          APP="build/dd/Build/Products/Release/Hermey.app"
          test -d "$APP"
          # Ad-hoc sign before packaging. A universal binary with no signature at all is not merely
          # "untrusted" — on Apple silicon the kernel refuses to execute it and macOS reports the app
          # as damaged, which xattr cannot repair. `-s -` costs no certificate: it is a local signature,
          # enough to run, and it does not make the app trusted by Gatekeeper (that needs notarization).
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          # One Mac artifact, and it is the one a person double-clicks: the volume opens as a window
          # with the app beside a shortcut to /Applications, so installing is one drag. (The zip this
          # replaced was only ever a wrapper around the same .app.)
          mkdir -p dist/dmg-root
          cp -R "$APP" dist/dmg-root/Hermey.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "Hermey" -srcfolder dist/dmg-root \
            -fs HFS+ -format UDZO -imagekey zlib-level=9 \
            -ov dist/Hermey-macOS-unsigned.dmg
          rm -rf dist/dmg-root
          hdiutil verify dist/Hermey-macOS-unsigned.dmg
          # And prove the artifact, not the build tree: mount what will be uploaded and check the
          # signature and the drag target from inside the mounted volume.
          MNT="$(mktemp -d)"
          hdiutil attach dist/Hermey-macOS-unsigned.dmg -nobrowse -readonly -mountpoint "$MNT" >/dev/null
          codesign --verify --strict --verbose=2 "$MNT/Hermey.app"
          test -L "$MNT/Applications" || { echo "the volume has no Applications shortcut to drag onto"; exit 1; }
          test -x "$MNT/Hermey.app/Contents/MacOS/Hermey" || { echo "the app inside the image is not executable"; exit 1; }
          hdiutil detach "$MNT" >/dev/null
          rmdir "$MNT"
          ls -la dist
      # Debug is not redundant with the Release archive: 96 `#if DEBUG` blocks exist across the app
      # targets and only this job compiles them.
      - name: Build iOS app (simulator, Debug)
        run: |
          set -o pipefail
          xcodebuild -project HermesApps.xcodeproj -scheme HermesMobile -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd-ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      # The archive rides along: same tree, same generated project, and one macOS runner instead of
      # two. A second job generated the project again and compiled HermesMobile again for this.
      - name: Archive (no signing)
        run: |
          set -o pipefail
          xcodebuild -project HermesApps.xcodeproj -scheme HermesMobile -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/HermesMobile.xcarchive \
            -derivedDataPath build/ipa-dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" PROVISIONING_PROFILE_SPECIFIER="" \
            MARKETING_VERSION=0.1.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} archive
      - name: Package Payload into .ipa
        run: |
          set -euo pipefail
          APP=$(find build/HermesMobile.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)
          echo "app: $APP"
          rm -rf Payload && mkdir -p Payload dist
          cp -R "$APP" Payload/
          # Ad-hoc signature so the binary is valid on arm64 even before FlareStore re-signs it.
          codesign --force --deep --sign - Payload/"$(basename "$APP")" || echo "ad-hoc signing skipped"
          zip -qry "dist/Hermey-unsigned.ipa" Payload
          unzip -l dist/Hermey-unsigned.ipa | head -20
          du -h dist/Hermey-unsigned.ipa
      - uses: actions/upload-artifact@v4
        # Only a push (i.e. `main`) produces a publishable build. A pull request from a fork would
        # otherwise hand a maintainer an artifact shaped by the PR's own project.yml. A dispatch
        # counts too: it runs the same committed tree, and without this a re-run for a starved
        # macOS pool built the app and then threw it away.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: Hermey-macOS-unsigned
          path: dist/Hermey-macOS-unsigned.dmg
          if-no-files-found: error
          # Published within minutes of the run ending; 90 days of every build is what filled the
          # account's 500 MB of Actions storage.
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: Hermey-unsigned-ipa
          path: dist/Hermey-unsigned.ipa
          if-no-files-found: error
          retention-days: 2

  bridge:
    name: Bridge (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./Bridge pytest httpx fastapi uvicorn websockets
      - name: Test
        run: pytest -q Bridge/tests

  qa:
    name: QA harness (bridge against replay gateway)
    runs-on: ubuntu-latest
    needs: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./Bridge pytest httpx fastapi uvicorn websockets
      - name: Scenario tests
        run: pytest -q Tools/qa

  hygiene:
    name: Secret and script hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No marketplace action: a scanner that needs third-party code to run has its own supply chain.
      - name: Scan for credential shapes
        run: bash Tools/ci/secret_scan.sh
      - name: Shellcheck the installer (it runs as root)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -S warning setup/install.sh Tools/ci/secret_scan.sh
      - name: Python syntax and imports
        run: |
          python3 -m compileall -q Bridge/hermes_bridge
      # Source-text guards that need no simulator: the bot-list bar, the reaction picker, and the
      # two files that advertise a build (README markers, no versioned download URLs).
      - name: Source guards
        run: python3 -m unittest discover -s Tests -p 'test_*.py'

  published-docs:
    name: Published pages and README match the release
    # Only on main: the check compares what gh-pages and README advertise against the newest
    # *release*, and a PR branch cannot repair them. This is the alarm that a hand-cut release left
    # the landing page or the README on an older build — the failure nobody notices by hand.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare the served build line with the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 Tools/release/sync_store.py --check --repo "$GITHUB_REPOSITORY"
